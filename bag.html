<!DOCTYPE html>
<html lang="en">

<head>

    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">

                        "background": "#fdf9ed",

                        "surface-container-highest": "#e5e3d7",

                        "on-secondary": "#ffffff",

                        "on-error": "#ffffff",

                        "on-secondary-fixed-variant": "#624000",

                        "surface-tint": "#486457",
                        "on-tertiary-container": "#f19d85",

    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>

<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col">
    <!-- Top Navigation -->
    <!-- Suppressed TopNavBar due to transactional nature of the page (Cart/Checkout intent), but keeping a simplified header for brand return -->
    <header
        class="bg-background border-b border-outline-variant flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto h-20">
        <div class="flex items-center gap-gutter">
            <div class="flex items-center gap-2">
                <div
                    class="w-8 h-8 rounded-full bg-tertiary flex items-center justify-center text-on-tertiary font-bold font-title-md">
                    P</div>
                <a class="font-headline-xl text-title-md md:text-headline-xl text-primary font-bold" href="#">Pages
                    &amp; Co.</a>
            </div>
            <nav class="hidden lg:flex gap-6 items-center">
                <a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md"
                    href="#">Home</a>
                <a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md"
                    href="#">Shop All</a>
                <a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md"
                    href="#">Fiction</a>
                <a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md"
                    href="#">Mystery</a>
                <a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md"
                    href="#">Children</a>
                <a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md"
                    href="#">Poetry</a>
            </nav>
        </div>
        <div class="flex items-center gap-6">
            <div class="hidden md:flex items-center bg-surface-container px-4 py-2 rounded-full gap-2 w-64">
                <span class="material-symbols-outlined text-on-surface-variant text-sm">search</span>
                <input type="text" placeholder="Search books..."
                    class="bg-transparent border-none focus:ring-0 text-sm w-full p-0">
            </div>
            <div class="flex items-center gap-4">
                <a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md hidden md:block"
                    href="#">Sign in</a>
                <button
                    class="bg-primary text-on-primary px-4 py-2 rounded-full font-body-md text-body-md flex items-center gap-2 hover:opacity-90 transition-opacity">
                    <span class="">Bag</span>
                    <span
                        class="bg-secondary-container text-on-secondary-container w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold">2</span>
                </button>
            </div>
        </div>
    </header>
    <!-- Main Content -->
    <main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-section-gap">
        <!-- Breadcrumb -->
        <nav aria-label="Breadcrumb" class="mb-stack-lg">
            <ol class="flex items-center gap-2 font-body-md text-sm text-on-surface-variant">
                <li class=""><a class="hover:text-primary transition-colors" href="#">Home</a></li>
                <li class="">/</li>
                <li aria-current="page" class="text-on-background">Bag</li>
            </ol>
        </nav>
        <!-- Page Title -->
        <h1
            class="font-display-lg text-headline-xl-mobile md:text-display-lg text-on-background mb-section-gap font-bold">
            Your bag</h1>
        <!-- Cart Layout Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter">
            <!-- Left Column: Cart Items -->
            <section class="lg:col-span-8 flex flex-col gap-4">
                <!-- Cart Item Card -->
                <div
                    class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 md:p-6 flex flex-col sm:flex-row gap-6 items-start sm:items-center">
                    <!-- Book Cover Placeholder -->
                    <div
                        class="w-24 h-32 md:w-32 md:h-40 flex-shrink-0 rounded-md bg-surface-tint shadow-sm overflow-hidden relative">
                        <!-- Abstract placeholder color -->
                        <div class="absolute inset-0 bg-primary-container opacity-80 mix-blend-multiply"></div>
                    </div>
                    <!-- Item Details -->
                    <div class="flex-grow flex flex-col gap-1">
                        <h2 class="font-title-md text-title-md text-on-background">The Lighthouse Keeper</h2>
                        <p class="font-body-md text-body-md text-on-surface-variant mb-2">Mara Ellison</p>
                        <button
                            class="text-tertiary-container hover:text-tertiary font-body-md text-sm text-left transition-colors w-fit">Remove</button>
                    </div>
                    <!-- Quantity & Price Controls -->
                    <div
                        class="flex flex-row sm:flex-col items-center justify-between w-full sm:w-auto sm:items-end gap-4 mt-4 sm:mt-0">
                        <div
                            class="flex items-center border border-outline-variant rounded-full bg-surface-container-lowest h-10 px-2">
                            <button aria-label="Decrease quantity"
                                class="w-8 h-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
                                <span class="material-symbols-outlined text-sm">remove</span>
                            </button>
                            <span
                                class="w-8 text-center font-body-md text-body-md text-on-background font-medium">2</span>
                            <button aria-label="Increase quantity"
                                class="w-8 h-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
                                <span class="material-symbols-outlined text-sm">add</span>
                            </button>
                        </div>
                        <span class="font-title-md text-title-md text-tertiary-container font-bold">$36.00</span>
                    </div>
                </div>
            </section>
            <!-- Right Column: Order Summary -->
            <section class="lg:col-span-4 mt-8 lg:mt-0">
                <div
                    class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 lg:p-8 sticky top-8">
                    <h2 class="font-title-md text-title-md text-on-background mb-6 font-bold">Order summary</h2>
                    <div class="flex flex-col gap-4 mb-6 border-b border-outline-variant pb-6">
                        <div
                            class="flex justify-between items-center font-body-md text-body-md text-on-surface-variant">
                            <span class="">Subtotal (2 items)</span>
                            <span class="text-on-background">$36.00</span>
                        </div>
                        <div
                            class="flex justify-between items-center font-body-md text-body-md text-on-surface-variant">
                            <span class="">Shipping</span>
                            <span class="text-on-background">Free</span>
                        </div>
                    </div>
                    <div
                        class="flex justify-between items-center font-title-md text-title-md text-on-background mb-8 font-bold">
                        <span class="">Total</span>
                        <span class="text-tertiary-container">$36.00</span>
                    </div>
                    <button
                        class="w-full bg-tertiary-container hover:bg-tertiary text-on-tertiary font-title-md text-title-md py-4 rounded-xl transition-colors mb-4 flex items-center justify-center gap-2">
                        Checkout
                    </button>
                    <p class="font-body-md text-sm text-on-surface-variant text-center">
                        You'll be asked to sign in to complete your order.
                    </p>
                </div>
            </section>
        </div>
    </main>
    <!-- Footer -->
    <!-- Suppressed main footer content to focus on checkout intent, leaving a minimal version if needed, but per rules, suppressing non-essential global nav if intent is linear. Assuming we keep it minimal or hide entirely. Let's hide full footer for transactional focus. -->


</body>

</html>
